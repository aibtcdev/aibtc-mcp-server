name: secret-scan

# Server-side backstop for the local pre-commit hook. Catches secrets pushed
# from machines without the hook installed, or commits made with --no-verify.
# Runs the open-source gitleaks binary directly — the gitleaks-action wrapper
# requires a paid license on organization repos, the binary does not.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Scan working tree for secrets
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --verbose
