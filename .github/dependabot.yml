# Dependabot version updates. Options reference:
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    # Runtime bumps land as fix(deps) so release-please cuts a release that
    # ships them to npm; dev-only bumps stay chore(deps-dev) and do not.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    # Hold new versions for a few days before proposing them. Security
    # updates are not delayed by cooldown.
    cooldown:
      default-days: 3
    groups:
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"
      # stacks.js publishes every @stacks/* package at the same version on the
      # same day (7.7.0 on 2026-11-03), and @stacks/transactions/network depend
      # on @stacks/common. Update them together so they don't drift apart, and
      # so one bump doesn't use up several of the five open-PR slots.
      stacks:
        patterns:
          - "@stacks/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
